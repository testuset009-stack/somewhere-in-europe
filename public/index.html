<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1"
>
<title>Somewhere in Europe — TV</title>
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div
id="secret-debug-zone"
aria-hidden="true"
></div>
<button
id="corner-host-btn"
type="button"
style="display: none;"
>📱 Host</button>
<div id="tv-stage">
<canvas
id="game-canvas"
width="1920"
height="1080"
></canvas>
</div>
<div
id="waiting-screen"
class="theme-rowan"
>
<div class="wait-box">
<img
id="wait-brand-logo"
class="wait-brand-logo"
src="assets/rowan-logo.svg"
alt="Rowan Events"
>
<div
id="wait-title"
class="wait-title"
>SOMEWHERE IN EUROPE</div>
<div
id="wait-sub"
class="wait-sub"
>UNIVERSAL MAP QUIZ ENGINE</div>
<div
id="wait-hint"
class="wait-hint"
>Select or launch a room from the host controller</div>
<div class="wait-actions">
<button
id="tv-fs-btn"
type="button"
class="wait-btn"
>⛶ FULLSCREEN</button>
<button
id="tv-sound-btn"
type="button"
class="wait-btn sound-on"
>🔊 SOUND: ON</button>
<button
id="tv-host-btn"
type="button"
class="wait-btn host-accent"
style="display: none;"
>📱 HOST REMOTE</button>
</div>
</div>
</div>
<iframe
id="debug-host-frame"
></iframe>
<script src="europe-map.js"></script>
<script src="tvscale.js"></script>
<script src="i18n-client.js"></script>
<script src="renderer.js"></script>
<script src="tv.js"></script>
</body>
</html>
